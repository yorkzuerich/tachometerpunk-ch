<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tachometerpunk — Inhalte bearbeiten</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<section id="loginGate" class="login-gate">
  <h1>Tachometerpunk — Inhalte bearbeiten</h1>
  <p class="hint">Bitte Passwort eingeben, um zum Editor zu gelangen.</p>
  <form id="loginForm" autocomplete="off">
    <label for="loginPassword">Passwort</label>
    <input type="password" id="loginPassword" required placeholder="Admin-Passwort" autofocus>
    <p id="loginStatus" class="status" role="status" aria-live="polite"></p>
    <button type="submit" id="loginBtn" class="save-btn login-btn">Weiter</button>
  </form>
</section>

<div id="editorWrap" hidden>
  <header class="top">
    <h1>Tachometerpunk — Inhalte bearbeiten</h1>
    <p class="hint">Änderungen hier landen als Commit im GitHub-Repo. Nach dem Speichern baut Vercel die Seite automatisch neu — das dauert meist ein bis zwei Minuten.</p>
  </header>

  <form id="contentForm" autocomplete="off">
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div id="fields">Lade aktuelle Inhalte…</div>
    <button type="submit" id="saveBtn" class="save-btn">Speichern</button>
  </form>
</div>

<script src="admin.js"></script>
</body>
</html>
